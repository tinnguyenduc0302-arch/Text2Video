[project]
name = "voicetovideo"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = ["PySide6>=6.8,<7", "edge-tts>=7,<8", "opencv-python>=4.10,<5", "Pillow>=11,<13", "faster-whisper>=1.1,<2", "imageio-ffmpeg>=0.6,<1", "av>=15,<18", "face-alignment>=1.4,<2", "librosa>=0.10,<0.11", "torch>=2.5,<3", "gdown>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
